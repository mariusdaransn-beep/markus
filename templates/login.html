{% extends "base.html" %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="card p-4 shadow-sm" style="max-width: 400px; margin: lumanari;">
    <h3 class="text-center mb-3">Login</h3>

    <form method="POST">
        <input class="form-control mb-3" type="email" name="email" placeholder="Email" required>
        <input class="form-control mb-3" type="password" name="password" placeholder="Parola" required>
        <button class="btn btn-primary w-100">Login</button>
    </form>
</div>
{% endblock %}
