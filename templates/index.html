{% extends "base.html" %}

{% block title %}Produse{% endblock %}

{% block content %}
<h1 class="mb-4 text-center">Produse disponibile</h1>

<div class="row">
    {% for p in products %}
    <div class="col-md-4">
        <div class="card mb-4 shadow-sm">
            <img src="{{ url_for('static', filename='images/' + p.image) }}" class="card-img-top" alt="{{ p.name }}">
            <div class="card-body">
                <h5 class="card-title">{{ p.name }}</h5>
                <p class="card-text">{{ p.description }}</p>
                <p class="fw-bold text-primary">{{ p.price }} lei</p>
                <a href="{{ url_for('product_page', product_id=p.id) }}" class="btn btn-primary w-100 mb-2">
                    Vezi produsul
                </a>
                <form method="POST" action="{{ url_for('add_to_cart', product_id=p.id) }}">
                    <button class="btn btn-outline-primary w-100" type="submit">Adaugă în coș</button>
                </form>
            </div><img src="{{ url_for('static', filename='images/' + p.image) }}" class="card-img-top" alt="{{ p.name }}">

        </div>
    </div>
    {% endfor %}
</div><!-- test -->

{% endblock %}
