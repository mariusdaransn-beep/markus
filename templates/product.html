{% extends "base.html" %}

{% block title %}{{ product.name }}{% endblock %}

{% block content %}
<div class="row">
    <div class="col-md-6">
        <img src="{{ product.image }}" class="img-fluid rounded shadow-sm" alt="{{ product.name }}">
    </div>
    <div class="col-md-6">
        <h2>{{ product.name }}</h2>
        <p class="mt-3">{{ product.description }}</p>
        <h4 class="text-primary">{{ product.price }} lei</h4>

        <form method="POST" action="{{ url_for('add_to_cart', product_id=product.id) }}" class="mt-3">
            <button class="btn btn-primary">Adaugă în coș</button>
        </form>
    </div>
    <img src="{{ url_for('static', filename='images/' + p.image) }}" class="card-img-top" alt="{{ p.name }}">

</div>
{% endblock %}
